<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esperiencia</title>
    <link rel="stylesheet" href="/pasta_estilo/estilo_geral.css">
    <link rel="stylesheet" href="/pasta_estilo/footer.css">
    <link rel="stylesheet" href="/pasta_estilo/sobrestl.css">
    <link rel="stylesheet" href="/pasta_estilo/espe.css">
</head>
<body>
 <section class="experiencias-section" id="experiencias">
  <div class="experiencias-container">
    
    <!-- Cabeçalho da Seção -->
    <div class="experiencias-header">
      <div class="experiencias-title">
        <h2>VIVA EXPERIÊNCIAS<br>INESQUECÍVEIS</h2>
        <div class="title-underline"></div>
      </div>
      <p class="experiencias-subtitle">
        Atividades, eventos e Roteiros para você viver o melhor de Brasília.
      </p>
    </div>

    <!-- Grid de Cards de Experiência -->
    <div class="experiencias-grid">
      
      <!-- Card 1 -->
      <div class="experiencia-card">
        <div class="card-image">
          <img src="/assets/Gemini_Generated_Image_wfs5ouwfs5ouwfs5.jpg" alt="Brasília Monumental">
          <div class="card-overlay">
            <span class="card-badge">ROTEIRO</span>
            <h3>Brasília Monumental</h3>
            <a href="#" class="card-link">Ver roteiro &rarr;</a>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="experiencia-card">
        <div class="card-image">
          <img src="/assets/Gemini_Generated_Image_w2aioqw2aioqw2ai.jpg" alt="Pôr do Sol no Pontão">
          <div class="card-overlay">
            <span class="card-badge">LAZER</span>
            <h3>Pôr do sol no Pontão do Lago Sul</h3>
            <a href="#" class="card-link">Ver mais &rarr;</a>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="experiencia-card">
        <div class="card-image">
          <img src="/assets/Gemini_Generated_Image_8m5rtt8m5rtt8m5r.jpg" alt="Festival de Inverno de Brasília">
          <div class="card-overlay">
            <span class="card-badge">EVENTO</span>
            <h3>Festival de Inverno de Brasília</h3>
            <a href="#" class="card-link">Ver mais &rarr;</a>
          </div>
        </div>
      </div>

    </div>

    <!-- Link Ver Todas na Parte Inferior -->
    <div class="experiencias-footer">
      <a href="#" class="btn-ver-todas">VER TODAS EXPERIÊNCIAS &rarr;</a>
    </div>

  </div>
</section>
</body>
</html>
