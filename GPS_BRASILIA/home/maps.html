<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa Interativo</title>

    <link rel="stylesheet" href="maps.css">
</head>

<body>

    <main class="container">

        <h1>MAPA INTERATIVO</h1>

        <div class="mapa">
            <iframe
                src="https://www.google.com/maps?q=Brasília&output=embed"
                allowfullscreen
                loading="lazy">
            </iframe>
        </div>

        <p>
            Navegue pelo mapa e descubra lugares incríveis perto de você
        </p>

        <a
            href="https://www.google.com/maps"
            target="_blank"
            class="botao">
            ABRIR MAPA
        </a>

    </main>

</body>

</html>
